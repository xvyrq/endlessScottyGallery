<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Endless Scotty Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #000;
      padding: 20px 40px;
      z-index: 1000;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    nav h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .nav-left { flex: 1; }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .control-btn:hover {
      background: #252525;
      transform: translateY(-2px);
    }

    .control-btn.active {
      border-color: #FFDD00;
    }

    .search-input {
      width: 140px;
      height: 40px;
      padding: 0 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
    }

    .search-input:focus {
      outline: none;
      border-color: #FFDD00;
    }

    /* Gallery */
    .gallery {
      margin-top: 80px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1800px;
      margin-inline: auto;
    }

    /* Card */
    .putter-card {
      position: relative;
      aspect-ratio: 1;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s ease;
      content-visibility: auto;
      contain-intrinsic-size: 280px 280px;
    }

    .putter-card:hover {
      transform: translateY(-4px);
    }

    .putter-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .putter-card img.loaded {
      opacity: 1;
    }

    .putter-card.error {
      display: none;
    }

    /* Skeleton */
    .skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        #1a1a1a,
        #252525,
        #1a1a1a
      );
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .coa-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,.8);
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 4px;
    }

    .loading-more {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #666;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-left">
    <h1>Endless Scotty Gallery</h1>
    <div id="counter" style="font-size:14px;color:#666">Loading…</div>
  </div>

  <div class="nav-center">
    <input id="coaSearch" class="search-input" placeholder="Search COA #" />
    <button id="randomBtn" class="control-btn active">🎲</button>
    <button id="sequentialBtn" class="control-btn">🔢</button>
  </div>
</nav>

<div id="gallery" class="gallery"></div>

<div id="loadingIndicator" class="loading-more">
  <span class="spinner"></span>
  Loading more putters…
</div>

<script>
  const COA_RANGE = { start: 1, end: 74674 };
  const BATCH_SIZE = 60;
  const IMAGE_VARIANTS = ['a']; // primary only (big win)

  function formatCOA(num) {
    return `A${String(num).padStart(6,'0')}`;
  }

  function getImageURL(coa, variant='a') {
    const raw = `media.scottycameron.com/images/authentication/putters/${coa}${variant}.JPG`;
    return `https://images.weserv.nl/?url=${raw}&w=800&output=webp&q=75`;
  }

  function getDetailsURL(coa) {
    return `https://www.scottycameron.com/legacy-site/authentication/registry/Details.aspx?rn=${coa}`;
  }

  const gallery = document.getElementById('gallery');
  const counter = document.getElementById('counter');
  const loadingIndicator = document.getElementById('loadingIndicator');

  let shuffled = [];
  let index = 0;
  let loaded = 0;
  let checked = 0;
  let mode = 'random';

  function updateCounter() {
    counter.textContent = `${loaded.toLocaleString()} loaded • ${checked.toLocaleString()} checked`;
  }

  function createCard(num) {
    const coa = formatCOA(num);
    const card = document.createElement('div');
    card.className = 'putter-card';
    card.onclick = () => window.open(getDetailsURL(coa),'_blank');

    const img = document.createElement('img');
    img.dataset.src = getImageURL(coa);
    img.loading = 'lazy';
    img.decoding = 'async';
    img.fetchPriority = 'low';

    img.onload = () => {
      img.classList.add('loaded');
      loaded++;
      updateCounter();
    };

    img.onerror = () => {
      card.classList.add('error');
      checked++;
      updateCounter();
    };

    const skeleton = document.createElement('div');
    skeleton.className = 'skeleton';

    const badge = document.createElement('div');
    badge.className = 'coa-badge';
    badge.textContent = coa;

    card.append(img, skeleton, badge);
    return card;
  }

  const imageObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const img = e.target;
        img.src = img.dataset.src;
        imageObserver.unobserve(img);
      }
    });
  }, { rootMargin: '50px' });

  function loadMore() {
    if (index >= shuffled.length) {
      loadingIndicator.style.display = 'none';
      return;
    }

    const batch = shuffled.slice(index, index + BATCH_SIZE);
    batch.forEach(n => {
      const card = createCard(n);
      gallery.appendChild(card);
      imageObserver.observe(card.querySelector('img'));
      checked++;
    });

    index += BATCH_SIZE;
    updateCounter();
  }

  function shuffleCOAs() {
    const arr = [];
    for (let i = COA_RANGE.start; i <= COA_RANGE.end; i++) arr.push(i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  shuffled = shuffleCOAs();
  loadMore();

  const scrollObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: '400px' });

  scrollObserver.observe(loadingIndicator);
</script>

</body>
</html>
